name: kegelexercisesapp
description: Guided pelvic floor exercises for men.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  shared_preferences: ^2.5.6
  purchases_flutter: ^11.0.1
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.2
  flutter_svg: ^2.3.4
  url_launcher: ^6.3.3
  intl: ^0.20.3
  material_ui: ^1.11.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  vibration: ^3.2.1
  package_info_plus: ^10.2.2
  flutter_timezone: ^5.1.1
  animated_notch_bottom_bar: ^1.0.4
  video_player: ^2.14.1
  supabase_flutter: ^2.12.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  uuid: ^4.5.2
  flutter_secure_storage: ^10.0.0
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.6
  firebase_performance: ^0.11.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/onboarding/cutouts/
    - assets/images/learn/
    - assets/content/
    - assets/content/articles/
    # Background-removed position cutouts for the 3D day panels.
    - assets/positions/
    # Pelvic-floor squeeze / relax demo (cropped, watermark-free).
    - assets/videos/pf_squeeze.mp4
    - assets/videos/pf_relax.mp4
    - assets/videos/pf_relaxed.jpg
    - assets/videos/pf_squeezed.jpg
    # Exercise demo videos (960x540, no audio) and posters.
    - assets/videos/exercises/
    - assets/videos/where_muscles.mp4
    - assets/videos/where_muscles.jpg

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
